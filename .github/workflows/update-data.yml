name: Update price data

# 联网刷新 Input/*.csv（SMH/SOXL/QQQ/TQQQ/USD 五标的行情 + 沪深300 对比基准），
# 重建 web/data.js 并提交回仓库，随后重新发布 GitHub Pages。
#
# 触发方式：
#   1) 页面上的「🔄 更新最新数据（云端）」按钮 —— 走 REST API workflow_dispatch
#   2) Actions 页面手动 Run workflow
#   3) 定时 A：每天荷兰时间 09:00（取前一交易日美股收盘数据）
#      GitHub cron 只认 UTC 且不随夏令时变动，故挂 07:00 + 08:00 UTC 两条，
#      再由下面的 "Gate" 步骤按 Europe/Amsterdam 实际小时判定，只放行真正的 9 点那次。
#   4) 定时 B：美东收盘后（22:30 UTC，周二~周六 ≈ 周一~周五收盘），当天就能看到最新行情
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '30 22 * * 2-6'

permissions:
  contents: write
  pages: write
  id-token: write

# 与 pages.yml 共用一个 concurrency group，避免两个工作流同时部署 Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 判定本次是否真的要跑：07:00/08:00 UTC 两条 cron 里只放行荷兰本地 09 点那一次
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          utc_h=$(date -u +%H)
          if [ "$utc_h" != "07" ] && [ "$utc_h" != "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          nl_h=$(TZ=Europe/Amsterdam date +%H)
          echo "UTC=${utc_h} Amsterdam=${nl_h}"
          if [ "$nl_h" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "非荷兰时间 09 点，跳过本次"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # update_data.py / build_data.py 只用标准库（urllib/csv/json），无需安装依赖

      - name: Fetch latest prices
        run: python update_data.py

      - name: Rebuild web/data.js
        run: python web/build_data.py

      - name: Commit changed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Input/*.csv web/data.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "行情无变化，跳过提交"
          else
            git commit -m "chore(data): 自动刷新行情数据（含沪深300 对比基准）"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN 产生的 push 不会触发 pages.yml，所以这里直接部署一次
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4